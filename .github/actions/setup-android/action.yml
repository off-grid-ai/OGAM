name: Set up the Android build
description: >
  Java, Gradle, the pinned NDK, the stable-diffusion.cpp video runtime and ccache: what every Android
  build runs after setup-mobile, in CI, UAT and release. One definition of each cache key, so a beta
  restores what main's CI saved. Only ccache differs by configuration.

inputs:
  video:
    description: Restore the video runtime, and build it on a miss. JVM unit tests never load it and pass 'false'.
    required: false
    default: 'true'
  ccache:
    description: The configuration (release) whose native compiles go through ccache. Empty sets up none.
    required: false
    default: ''
  save:
    description: Save a fresh video runtime and compiler cache. Release passes 'false' and only restores.
    required: false
    default: 'true'
  lookup-only:
    description: Only check the video runtime's cache, and build it when it misses. Main's CI warms the cache this way without downloading it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Gradle wrapper and dependency caches. The open-source 'basic' provider: the default
    # 'enhanced' one is a commercial service. Only main writes the cache; everything else reads it.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
    - name: Turn on the Gradle build cache
      # In the runner's Gradle home, not android/gradle.properties: local builds stay as they are.
      shell: bash
      run: echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

    # Configuring the native modules (op-sqlite etc.) needs the pinned NDK; the runner image doesn't
    # ship it, so the build failed at configure with "Failed to install ndk;...". Install the
    # version android/build.gradle forces.
    - name: Install Android NDK
      shell: bash
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" "ndk;27.1.12297006" >/dev/null

    # The video runtime's prebuilt parts: the host shader compiler (shaderc) and the Hexagon DSP
    # libraries built in Docker, plus the patched stable-diffusion.cpp source. Built once per
    # revision of scripts/video; the script skips each part whose ready marker matches. The Hexagon
    # SDK and the build trees are left out: they are only needed to build those parts.
    - name: Restore the Android video runtime
      id: video_cache
      if: ${{ inputs.video == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .video-build
          !.video-build/hexagon-sdk
          !.video-build/hexagon-sdk.tar.xz
          !.video-build/hexagon-build
          !.video-build/shaderc-source
        key: video-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/video/**', 'scripts/prepare-video-runtime.sh') }}
        lookup-only: ${{ inputs.lookup-only }}
    - name: Build the Android video runtime
      if: ${{ inputs.video == 'true' && steps.video_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: bash scripts/prepare-video-runtime.sh --android
    - name: Save the Android video runtime
      if: ${{ inputs.video == 'true' && inputs.save == 'true' && steps.video_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .video-build
          !.video-build/hexagon-sdk
          !.video-build/hexagon-sdk.tar.xz
          !.video-build/hexagon-build
          !.video-build/shaderc-source
        key: ${{ steps.video_cache.outputs.cache-primary-key }}

    # ccache for the NDK compiles (React Native's C++, stable-diffusion.cpp and ggml for each ABI).
    # Outside the checkout: uat.sh refuses a dirty tree. The caller sets CMAKE_C_COMPILER_LAUNCHER
    # and CMAKE_CXX_COMPILER_LAUNCHER to ccache on its Gradle build.
    - name: Locate the ccache directory
      if: ${{ inputs.ccache != '' }}
      shell: bash
      run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
    - name: Setup ccache
      if: ${{ inputs.ccache != '' }}
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: android-${{ inputs.ccache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/video/revision') }}
        restore-keys: android-${{ inputs.ccache }}-${{ runner.os }}-${{ runner.arch }}-
        max-size: 3G
        # Keep only what this build used, so the saved cache does not grow run after run.
        evict-old-files: job
        save: ${{ inputs.save == 'true' }}

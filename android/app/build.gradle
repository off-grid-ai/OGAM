apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.devtools.ksp"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ai.offgridmobile"
    defaultConfig {
        applicationId "ai.offgridmobile.atlas"
        // llama.kt (Vulkan text) is built for API 29. The app keeps API 24: the manifest
        // overrides the library minimum and AtlasVulkanModule refuses to load it below API 29.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1784144551
        // CI passes -PatlasBuild=<run number>, so the version shown in the app says which build it is.
        versionName "0.0.147" + (project.hasProperty('atlasBuild') ? " (build ${project.property('atlasBuild')})" : "")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI release secrets are injected as environment variables; local signing
            // through Gradle properties is also supported without storing credentials.
            def signingPath = System.getenv('OFFGRID_UPLOAD_STORE_FILE') ?: project.findProperty('OFFGRID_UPLOAD_STORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('OFFGRID_UPLOAD_STORE_PASSWORD') ?: project.findProperty('OFFGRID_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('OFFGRID_UPLOAD_KEY_ALIAS') ?: project.findProperty('OFFGRID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('OFFGRID_UPLOAD_KEY_PASSWORD') ?: project.findProperty('OFFGRID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            // Amazon IAP's com.amazon.device.iap.ResponseReceiver (pulled in transitively
            // via RevenueCat) ships pre-Java-7 bytecode without stackmap frames. Robolectric
            // instantiates every receiver in the merged manifest during app setup, and that
            // class fails strict bytecode verification on JDK 17+ (VerifyError: "Expecting a
            // stackmap frame at branch target"). Relax verification for the unit-test JVM only.
            all {
                jvmArgs '-noverify'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".dev"
        }
        release {
            // Experimental builds may retain debug signing. Published releases must
            // be signed with the permanent upload key and fail closed otherwise.
            if (project.findProperty('atlasRequireReleaseSigning') == 'true') {
                if (!signingConfigs.release.storeFile ||
                    !signingConfigs.release.storePassword ||
                    !signingConfigs.release.keyAlias ||
                    !signingConfigs.release.keyPassword) {
                    throw new GradleException('Permanent Atlas release-signing credentials are required.')
                }
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packaging {
        jniLibs {
            // Force compressed .so storage so Play Store extracts libs to nativeLibraryDir
            // as real filesystem files. Without this, AGP's default "uncompressed native libs"
            // stores .so files inside the APK zip — File.exists() returns false for them and
            // exec() fails with EACCES (error=13) because you can't fork-exec from a zip entry.
            useLegacyPackaging = true
            // Atlas: libkiwix ships its own libc++_shared.so like other native libraries.
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    aaptOptions {
        // Prevent AAPT from compressing .gguf model files — they must be copied byte-for-byte
        noCompress 'gguf'
    }
}

configurations.all {
    exclude group: 'com.android.support'
}

dependencies {
    // Release builds package the llama.kt Vulkan text engine (-PatlasVulkanEnabled=true).
    // Without it the app still runs: AtlasVulkanModule reports the engine as not packaged.
    if (project.findProperty('atlasVulkanEnabled') == 'true') {
        implementation project(':atlasLlamaKt')
    }
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Atlas: read Kiwix .zim offline libraries (Wikipedia, WikiMed, iFixit, Wikivoyage)
    implementation("org.kiwix:libkiwix:2.6.0")

    // Atlas: offline vector maps (Mapsforge .map files, drawn on the phone)
    implementation("org.mapsforge:mapsforge-map-android:0.21.0")
    implementation("org.mapsforge:mapsforge-map-reader:0.21.0")
    implementation("org.mapsforge:mapsforge-themes:0.21.0")
    implementation("com.caverock:androidsvg:1.4")

    // Atlas: natural offline voices (sherpa-onnx; the AAR is fetched by CI into libs/)
    implementation(files("libs/sherpa-onnx.aar"))

    // Coroutines for async operations (used by LocalDreamModule)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // PDF text extraction (used by PDFExtractorModule)
    implementation("io.legere:pdfiumandroid:1.0.35")

    // LiteRT-LM on-device LLM inference (pinned — do not use latest.release)
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.11.0")

    // Download layer — Room + WorkManager + OkHttp
    def room_version = "2.8.2"
    implementation("androidx.room:room-runtime:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")
    implementation("androidx.work:work-runtime-ktx:2.10.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.8.7")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // Atlas: unpacking voice files the user imports (.tar.bz2 from sherpa-onnx, .zip)
    implementation("org.apache.commons:commons-compress:1.27.1")
    // In-app QR scanner for offline device pairing: CameraX plus ML Kit's bundled QR model
    // (works offline; no Google Play services download).
    implementation("androidx.camera:camera-camera2:1.4.2")
    implementation("androidx.camera:camera-lifecycle:1.4.2")
    implementation("androidx.camera:camera-view:1.4.2")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")
    // CameraX hands back a ListenableFuture (Guava) for the camera provider.
    implementation("com.google.guava:guava:33.3.1-android")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.13")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito.kotlin:mockito-kotlin:5.4.0")
    testImplementation("androidx.test:core:1.6.1")
}

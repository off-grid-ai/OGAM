<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Off Grid AI Mobile preview</title>
    <style>
      /* The app's fonts (bundled in the phone app; a browser needs them declared). build:preview copies
         them into fonts/. */
      @font-face { font-family: 'Geist'; font-weight: 200; src: url(./fonts/Geist-UltraLight.ttf); }
      @font-face { font-family: 'Geist'; font-weight: 300; src: url(./fonts/Geist-Light.ttf); }
      @font-face { font-family: 'Geist'; font-weight: 400; src: url(./fonts/Geist-Regular.ttf); }
      @font-face { font-family: 'Geist'; font-weight: 500 900; src: url(./fonts/Geist-Medium.ttf); }
      @font-face { font-family: 'Geist Mono'; font-weight: 100 300; src: url(./fonts/GeistMono-Light.ttf); }
      @font-face { font-family: 'Geist Mono'; font-weight: 400; src: url(./fonts/GeistMono-Regular.ttf); }
      @font-face { font-family: 'Geist Mono'; font-weight: 500 900; src: url(./fonts/GeistMono-Medium.ttf); }
      @font-face { font-family: 'Feather'; src: url(./fonts/Feather.ttf); }
      @font-face { font-family: 'MaterialCommunityIcons'; src: url(./fonts/MaterialCommunityIcons.ttf); }
      @font-face { font-family: 'MaterialIcons'; src: url(./fonts/MaterialIcons.ttf); }
      html, body { font-family: 'Geist', system-ui, sans-serif; }
      html, body { height: 100%; margin: 0; background: #0a0a0a; }
      #root { display: flex; height: 100%; max-width: 430px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./index.bundle.js"></script>
  </body>
</html>

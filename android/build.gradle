buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // react-native-inappbrowser-reborn otherwise requests dynamic `+`
        // versions. Pin them so Gradle does not query unrelated repositories
        // for metadata during an offline/local build.
        androidXAnnotationVersion = "1.5.0"
        androidXBrowserVersion = "1.4.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.2.0-2.0.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force every Android subproject (incl. third-party native modules like op-sqlite and
// react-native-audio-api) onto the ONE pinned NDK. Without this, a module that declares
// no ndkVersion falls back to the AGP-default NDK (27.0.12077973), which the app never
// pins or installs — CI then fails to configure with "Failed to install ndk;27.0.12077973".
// Applied via plugins.withId (runs when the Android plugin is applied) rather than
// afterEvaluate — the latter threw "Cannot run afterEvaluate when the project is already
// evaluated" for subprojects the React root plugin had already configured.
subprojects { subproject ->
    // Gradle 9 fails a Test task when a third-party React Native module ships test
    // sources that its own configuration does not discover. Those dependency tests
    // are not our test authority. Keep :app fail-closed, but let external modules
    // report an empty test task instead of blocking the product build.
    if (subproject.path != ":app") {
        subproject.tasks.withType(Test).configureEach {
            failOnNoDiscoveredTests = false
        }
    }

    ["com.android.application", "com.android.library"].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.android {
                ndkVersion rootProject.ext.ndkVersion
            }
        }
    }
}

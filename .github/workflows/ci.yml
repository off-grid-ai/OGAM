name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'release/*'

# A new push to a pull request replaces its running checks, which would otherwise hold runners
# (the macOS ones are few) for a commit nobody will merge. Pushes to main each finish: their
# caches are the ones pull requests restore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Parallel jobs on one shared setup.
#
# This was ONE job, for a reason worth keeping: lint, typecheck, architecture and test used to be
# four jobs that each repeated the same setup steps, and the copies drifted (one lost its
# `env: PRO_SUBMODULE_PAT` and never provisioned shared at all). The setup now lives once, in
# .github/actions/setup-mobile, and every job calls it, so the jobs can run side by side without
# copies to drift. Run serially, Jest alone took 37 minutes of a 55-minute job.
#
# Everything but the iOS tests runs on Linux runners, which a public repository gets many of at
# once; only the iOS job waits for the scarce macOS runners.
jobs:
  gates:
    name: lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ github.event_name != 'workflow_dispatch' && secrets.PRO_SUBMODULE_PAT || '' }}

      # Every gate runs even when an earlier one failed, so a single red gate cannot hide the rest;
      # the job still fails if any of them do.
      #
      # ESLint ONLY - deliberately not `npm run lint`, which chains ./gradlew :app:lintDebug.
      # Measured on run 31020019489: eslint finished in 36 SECONDS; Android Lint then ran for 68
      # MINUTES, cold-configuring every React Native native module. Android Lint stays a LOCAL
      # pre-merge gate (npm run lint:android); the Android unit tests still run below.
      - name: Lint the nightly workflow (actionlint)
        # The UAT nightly only runs on dispatch: this shows a broken uat-dev.yml on the pull request.
        # Its structure (pinned commit, uploads after builds, finalize after uploads, plan credentials)
        # and uat.sh's --plan are checked by the Jest tests in __tests__/scripts. shellcheck is off so
        # the gate does not depend on what the runner image happens to ship.
        if: ${{ !cancelled() }}
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck= .github/workflows/uat-dev.yml .github/workflows/ci.yml

      - name: Lint (eslint)
        if: ${{ !cancelled() }}
        run: npx eslint .

      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # Standing gates: dependency-cruiser (layering, engine DIP, import cycles, orphans - 0
      # violations, no baseline) + knip (dead files/exports/types/deps - 0 issues). Both fail on
      # anything NEW.
      - name: Dependency-cruiser (architecture gate)
        if: ${{ !cancelled() }}
        run: npm run depcruise

      - name: knip (dead-code gate)
        if: ${{ !cancelled() }}
        run: npm run knip

  jest:
    name: jest (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Balanced by recorded suite run time (scripts/jest-sequencer.js), not by suite count.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ github.event_name != 'workflow_dispatch' && secrets.PRO_SUBMODULE_PAT || '' }}

      # Jest's transform cache (babel output per file, keyed by file content and config), one per
      # shard because each shard transforms its own suites. Restored and saved in separate steps:
      # actions/cache saves in its post step only when the whole job succeeds, and a red test run
      # would throw the cache away.
      - name: Restore Jest transforms
        id: jest_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'babel.config.js', 'jest.config.js') }}-shard${{ matrix.shard }}-${{ github.sha }}
          # Any earlier cache last: transforms are keyed by file content and config, so a stale
          # entry is never used, and a new lock file then retransforms only what changed.
          restore-keys: |
            jest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'babel.config.js', 'jest.config.js') }}-shard${{ matrix.shard }}-
            jest-${{ runner.os }}-${{ runner.arch }}-

      # A shard holds an eighth of the suites, so it cannot check coverageThreshold: the files the
      # other shards cover would look uncovered. It saves its raw coverage instead, and the coverage
      # job below merges all eight and checks the thresholds as one unsharded run would.
      - name: Run Jest tests
        id: jest
        env:
          JEST_CACHE_DIR: ${{ runner.temp }}/jest-cache
          # Serial within the shard, in ONE recycled worker instead of --runInBand.
          #
          # In band, every suite runs in the same process and the heap left after each suite only
          # grows (measured locally on 2dbf3e75: ~0.4 GB after the first suite, ~6.3 GB after the
          # last), so the back half of the run swaps and late, otherwise fast tests time out.
          # --maxWorkers=1 keeps the run serial (the parallel run flaked on CPU contention, see
          # b18e65f5). --workerIdleMemoryLimit replaces that worker once its heap passes 1 GB after
          # a suite, so memory stays bounded for the whole run.
          NODE_OPTIONS: --max-old-space-size=4096
          SHARD: ${{ matrix.shard }}
        run: >-
          npx jest --shard="$SHARD/8" --coverage --coverageReporters=json --coverageThreshold='{}'
          --forceExit --maxWorkers=1 --workerIdleMemoryLimit=1GB --cacheDirectory="$JEST_CACHE_DIR"
          --json --outputFile="$RUNNER_TEMP/jest-results.json"

      # Saved after a failing run too: the transforms are keyed by file content, not by the results.
      - name: Save Jest transforms
        if: ${{ !cancelled() && steps.jest.outcome != 'skipped' && steps.jest_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jest-cache
          key: ${{ steps.jest_cache.outputs.cache-primary-key }}

      - name: Upload the shard's coverage
        if: ${{ !cancelled() && steps.jest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-final.json
          retention-days: 1

      # Each suite's run time, to refresh scripts/jest-timings.json (scripts/update-jest-timings.js).
      - name: Upload the shard's suite times
        if: ${{ !cancelled() && steps.jest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: jest-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/jest-results.json
          retention-days: 14

  coverage:
    name: coverage
    needs: jest
    if: ${{ !cancelled() }}
    # The same runner image as the shards: the coverage holds absolute file paths, and the
    # thresholds match files by path.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pro/ is needed: jest.config.js measures and gates it only when it is checked out.
      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ github.event_name != 'workflow_dispatch' && secrets.PRO_SUBMODULE_PAT || '' }}
          shared: 'false'

      - name: Download the shards' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Merge the coverage and check the thresholds
        run: node scripts/merge-coverage.js "$RUNNER_TEMP/coverage-shards"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  android:
    name: android tests
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    # Gradle unit tests need no Mac, and Linux runners start at once; only iOS waits for macOS.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ github.event_name != 'workflow_dispatch' && secrets.PRO_SUBMODULE_PAT || '' }}

      - name: Set up the Android build
        uses: ./.github/actions/setup-android
        with:
          video: 'false'

      - name: Run Android tests
        run: cd android && ./gradlew :app:testDebugUnitTest --rerun-tasks

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: ios tests
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Start the simulator now, so its first-boot set-up runs during the install and build instead
      # of during the tests; scripts/test-ios.sh waits for the boot to finish on this same device.
      - name: Boot the iOS simulator
        run: |
          id="$(bash scripts/ios-simulator-id.sh)"
          echo "IOS_SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          # In the background: the boot itself took a minute of this step (2026-11-10).
          nohup xcrun simctl boot "$id" >/dev/null 2>&1 &

      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ github.event_name != 'workflow_dispatch' && secrets.PRO_SUBMODULE_PAT || '' }}

      - name: Set up the iOS build
        id: ios
        uses: ./.github/actions/setup-ios
        with:
          configuration: debug

      - name: Run iOS tests
        id: ios_tests
        env:
          XCODE_XCCONFIG_FILE: ${{ steps.ios.outputs.xcconfig }}
        run: npm run test:ios

      - name: Save Xcode module cache
        if: ${{ !cancelled() && steps.ios_tests.outcome != 'skipped' && steps.ios.outputs.modules-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ${{ steps.ios.outputs.modules-key }}

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # The Android video runtime a UAT build restores (.github/actions/setup-android). The JVM tests
  # above never build it, so main's push saves it here and the first beta after a merge restores it
  # instead of building cold. It looks up its key without downloading and builds only on a miss.
  # The iOS pods and video runtime are saved by the iOS job.
  release-caches:
    name: release caches (Android video)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android build
        uses: ./.github/actions/setup-android
        with:
          lookup-only: 'true'

  # Whether the pull request changes an input of the video runtime builds: stable-diffusion.cpp's
  # pinned revision, its patches, or the scripts that build it. The same paths as videoRuntimeMoved
  # in scripts/lib/engines.js. Read from the API, so no checkout is needed.
  changes:
    name: changed inputs
    runs-on: ubuntu-latest
    outputs:
      video: ${{ steps.files.outputs.video }}
      native: ${{ steps.files.outputs.native }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PRO_TOKEN: ${{ secrets.PRO_SUBMODULE_PAT }}
        run: |
          video=false
          # Native tests run on main, on a dispatch, and on a pull request that touches what they
          # build: native code, dependencies and their patches, the pro pin, or CI itself. A JS-only
          # pull request skips the macOS runner (the 14-minute critical path, 2026-11-10).
          native=true
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
            if grep -Eq '^(scripts/video/|scripts/prepare-video-runtime\.sh$|scripts/build-video-ios\.sh$)' "$RUNNER_TEMP/files.txt"; then video=true; fi
            native=false
            if grep -Eq '^(ios/|android/|patches/|pro$|\.github/|package(-lock)?\.json$|Gemfile|react-native\.config\.js$|app\.json$|scripts/(test-ios|test-android|ios-simulator-id|download-prebuilt-binaries)[^/]*$)' "$RUNNER_TEMP/files.txt"; then native=true; fi
            # CI builds pro's matching branch, whose native changes this pull request's files do not list.
            if [ -n "$PRO_TOKEN" ] && git -c http.https://github.com/.extraheader= ls-remote --exit-code --heads \
              "https://x-access-token:${PRO_TOKEN}@github.com/off-grid-ai/mobile-pro.git" "$HEAD_REF" >/dev/null 2>&1; then native=true; fi
          fi
          echo "video=$video" | tee -a "$GITHUB_OUTPUT"
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  # The video runtimes built from source, with no cache, on a pull request that changes their inputs:
  # chiefly the engine bot's stable-diffusion.cpp bump (scripts/merge-engine-pr.js merges it only
  # when both succeeded). A patch can still apply to a new revision and then fail to compile; the
  # tests above never build the runtime, and the UAT build found it too late. Other pull requests
  # skip both jobs and keep using the cache.
  #
  # Android: the patched source, shaderc and the Hexagon DSP libraries (in linux/amd64 Docker), then
  # the app's native libraries for arm64, which compile stable-diffusion.cpp with Vulkan, OpenCL and
  # Hexagon and link the JNI bridge. Release, as a store build compiles it.
  video-android:
    name: video runtime (Android)
    needs: changes
    if: ${{ needs.changes.outputs.video == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ secrets.PRO_SUBMODULE_PAT }}

      - name: Set up the Android build
        uses: ./.github/actions/setup-android
        with:
          video: 'false'

      - name: Prepare the video runtime from source
        run: bash scripts/prepare-video-runtime.sh --android

      # Space for the native build: the SDK archive, the DSP build tree and the Docker image are only
      # needed above. The extracted SDK stays: the app's Hexagon stub compiles against its headers.
      # sudo: the Hexagon build ran as root in Docker and owns its build tree.
      - name: Free the Hexagon build space
        run: |
          sudo rm -rf .video-build/hexagon-sdk.tar.xz .video-build/hexagon-build
          docker image prune -af
          df -h .

      - name: Build the native libraries (arm64, release)
        run: cd android && ./gradlew :app:externalNativeBuildRelease -PreactNativeArchitectures=arm64-v8a

  # iOS: the patched source built into the xcframework for device and simulator, as pod install does.
  video-ios:
    name: video runtime (iOS)
    needs: changes
    if: ${{ needs.changes.outputs.video == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the video runtime from source
        run: bash scripts/build-video-ios.sh

      - name: Check the framework for each platform
        run: |
          for platform in ios-arm64 ios-arm64-simulator; do
            test -s "native/video/OffgridVideoRuntime.xcframework/$platform/OffgridVideoRuntime.framework/OffgridVideoRuntime"
          done

  # One check to require, and the name the single job had: green only when every job above is. The
  # video runtime jobs may be skipped only when the pull request leaves their inputs alone.
  ci:
    needs: [gates, jest, coverage, android, ios, changes, video-android, video-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.gates.result }} ${{ needs.jest.result }} ${{ needs.coverage.result }} ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          NATIVE_RESULTS: ${{ needs.android.result }} ${{ needs.ios.result }}
          VIDEO: ${{ needs.changes.outputs.video }}
          VIDEO_RESULTS: ${{ needs.video-android.result }} ${{ needs.video-ios.result }}
        run: |
          echo "jobs: $RESULTS; native changed: $NATIVE, tests: $NATIVE_RESULTS; video runtime moved: $VIDEO; video builds: $VIDEO_RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
          for result in $NATIVE_RESULTS; do
            [ "$result" = success ] || { [ "$NATIVE" != true ] && [ "$result" = skipped ]; } || exit 1
          done
          for result in $VIDEO_RESULTS; do
            [ "$result" = success ] || { [ "$VIDEO" != true ] && [ "$result" = skipped ]; } || exit 1
          done

  # NOTE: the Android build is NOT run in CI — it is a LOCAL pre-merge gate instead (the hosted
  # runner repeatedly hung for 3+ hours on the native C++ builds and burned hours). Run it locally
  # before merging any change that touches native/Android/gradle/deps:
  #     cd android && ./gradlew assembleDebug assembleRelease
  # (see rules.md → On-device testing & verification). Docs-only / JS-only PRs don't need it.

  # NOTE: SonarCloud runs via Automatic Analysis (SonarCloud-side, on the public core project) —
  # no CI job. A CI scan would only add coverage import, which Codecov already does, so it'd be
  # redundant complexity. Pro is scanned locally by eslint-plugin-sonarjs (free, private, no leak).
  # See docs/GAPS_BACKLOG.md.

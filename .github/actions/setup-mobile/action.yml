name: Set up the mobile workspace
description: >
  Node, the private pro/ and shared checkouts, and node_modules: the setup every building job runs
  first, in CI, UAT, release and the engine updates. One definition, so one Node version and one
  set of cache keys, and the jobs cannot drift apart the way the copies of these steps once did.

inputs:
  private-token:
    description: PRO_SUBMODULE_PAT, or empty where it is not available (forks, workflow_dispatch).
    required: false
    default: ''
  workspace:
    description: >
      'false' sets up Node only, for jobs that run this repository's scripts without its
      dependencies (the UAT plan, uploads and finalize).
    required: false
    default: 'true'
  shared:
    description: Check out and build the shared monorepo beside this checkout.
    required: false
    default: 'true'
  pro-ref:
    description: The pro commit to build. Empty takes the branch that matches this run (CI); a build that ships passes the commit Core pins.
    required: false
    default: ''
  shared-ref:
    description: The shared ref to build against. Empty takes the branch that matches this run.
    required: false
    default: ''
  save-caches:
    description: >
      'false' only restores. Release runs on dispatch and writes no cache; main's CI saves every
      cache a release restores.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Node 26. The RAG/knowledge-base suites run a REAL in-memory database via node's built-in
        # `node:sqlite` (__tests__/harness/sqliteFake.ts). That module is absent on Node 20 and
        # flag-gated on Node 22. On Node 24 it loads but its native teardown SEGFAULTs the process
        # under jest's --forceExit (exit 139). Node 26's node:sqlite fixes that teardown crash.
        # The builds that ship use the same Node, so they restore the node_modules CI saved.
        node-version: '26'
        cache: 'npm'

    # Pull the private pro/ so the pro-dependent suites run against the REAL package - a green run
    # then actually exercises pro, not a stub. It also matters to the other gates: tsc sees
    # __tests__/pro/* importing @offgrid/pro/* (TS2307 without it), and knip/depcruise need it or
    # their reachability graph is incomplete and reports false orphans. Without the token the jobs
    # skip this: proExists=false and jest runs the open-core suite instead.
    #
    # CI takes the MATCHING branch, not the submodule pin. The pin records which pro revision a core
    # commit was verified against, but a coordinated core+pro change has to be tested with both
    # halves together. Matching branch first, PR base branch as the fallback - the same for shared
    # below, and the same as OGAD. A build that ships passes the pinned commit instead. A composite
    # step cannot continue on error, so the branch is looked up first instead of trying one
    # checkout and falling back on its failure.
    - name: Pick the pro and shared branches
      id: refs
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' }}
      shell: bash
      env:
        TOKEN: ${{ inputs.private-token }}
        PRO_REF: ${{ inputs.pro-ref }}
        SHARED_REF: ${{ inputs.shared-ref }}
        HEAD_REF: ${{ github.head_ref || github.ref_name }}
        BASE_REF: ${{ github.base_ref || 'main' }}
      # The checkout of this repository saved its own login as a header for all of github.com, and
      # that header would override the token in the address; it is cleared for these lookups.
      # `--exit-code` exits 2 when the branch does not exist. Any other failure stops the job, so a
      # bad token cannot quietly test against the base branch instead.
      run: |
        pick() {
          local status=0
          git -c http.https://github.com/.extraheader= ls-remote --exit-code --heads \
            "https://x-access-token:${TOKEN}@github.com/off-grid-ai/$1.git" "$HEAD_REF" >/dev/null || status=$?
          case "$status" in
            0) echo "$HEAD_REF" ;;
            2) echo "$BASE_REF" ;;
            *) echo "::error::Could not read off-grid-ai/$1 (git exit $status)" >&2; return 1 ;;
          esac
        }
        # Assigned first: `echo "x=$(pick)"` would hide a failed lookup behind echo's success.
        if [ -n "$PRO_REF" ]; then pro=$PRO_REF; else pro=$(pick mobile-pro); fi
        if [ -n "$SHARED_REF" ]; then shared=$SHARED_REF; else shared=$(pick shared); fi
        echo "pro=$pro" >> "$GITHUB_OUTPUT"
        echo "shared=$shared" >> "$GITHUB_OUTPUT"
        echo "pro: $pro, shared: $shared"

    - name: Check out pro
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' }}
      uses: actions/checkout@v4
      with:
        repository: off-grid-ai/mobile-pro
        token: ${{ inputs.private-token }}
        path: pro
        ref: ${{ steps.refs.outputs.pro }}
        persist-credentials: false

    # @offgrid/sync, @offgrid/rag and the other shared packages are file: dependencies on the
    # SIBLING shared monorepo ("file:../shared/packages/sync"). Without it every gate fails on the
    # same missing module: TS2307 in typecheck, no-phantom-deps in the architecture gate, and jest
    # suites unable to resolve <workspace>/../shared/packages/sync/src/index.ts.
    #
    # actions/checkout refuses a path outside the workspace, so it lands inside and is moved up one
    # level - which is exactly where the file: specifiers and jest's moduleNameMapper both point.
    - name: Check out the shared monorepo
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' && inputs.shared == 'true' }}
      uses: actions/checkout@v4
      with:
        repository: off-grid-ai/shared
        token: ${{ inputs.private-token }}
        path: _shared
        ref: ${{ steps.refs.outputs.shared }}
        persist-credentials: false
    # Shared is installed and built once per shared commit: its node_modules and every package's
    # dist/ are cached on that commit, so a job on the same commit restores them instead of
    # rebuilding (1.5 to 2 minutes per job). The paths are absolute: actions/cache saves nothing
    # for ../ paths outside the workspace. Everything restored is ignored by shared's git, so its
    # tree stays as checked out (uat.sh requires it clean).
    - name: Put shared beside this checkout
      id: shared
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' && inputs.shared == 'true' }}
      shell: bash
      run: |
        echo "sha=$(git -C _shared rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        rm -rf ../shared
        mv _shared ../shared
        echo "dir=$(cd ../shared && pwd)" >> "$GITHUB_OUTPUT"
        # Every shared package this app consumes; a package this shared commit lacks is skipped.
        echo "packages=design automation sync rag models speech ui writing notes notes-editor" >> "$GITHUB_OUTPUT"
    - name: Restore the built shared packages
      id: shared_cache
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' && inputs.shared == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.shared.outputs.dir }}/node_modules
          ${{ steps.shared.outputs.dir }}/packages/*/node_modules
          ${{ steps.shared.outputs.dir }}/packages/*/dist
        key: shared-${{ runner.os }}-${{ runner.arch }}-node26-${{ steps.shared.outputs.sha }}-${{ hashFiles('.github/actions/setup-mobile/action.yml') }}
    - name: Build shared
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' && inputs.shared == 'true' && steps.shared_cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        PACKAGES: ${{ steps.shared.outputs.packages }}
      run: |
        # Install at the WORKSPACE ROOT: shared is an npm-workspaces monorepo, and the lock file and
        # the build tool (tsup) live at the root. A LOCKED install and no fallback: an unlocked one
        # resolves a graph nobody committed.
        npm --prefix ../shared ci
        # Build every shared package this app consumes: npm resolves each file: dependency to its
        # dist/ (Jest reads src/, but TypeScript and Metro read dist/).
        for package in $PACKAGES; do
          if [ -f "../shared/packages/$package/package.json" ]; then
            npm --prefix "../shared/packages/$package" run build
          fi
        done
        # The build leaves ../shared's tree as checked out: uat.sh requires it clean.
        git -C ../shared status --porcelain
    - name: Save the built shared packages
      if: ${{ inputs.workspace == 'true' && inputs.private-token != '' && inputs.shared == 'true' && inputs.save-caches == 'true' && steps.shared_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.shared.outputs.dir }}/node_modules
          ${{ steps.shared.outputs.dir }}/packages/*/node_modules
          ${{ steps.shared.outputs.dir }}/packages/*/dist
        key: ${{ steps.shared_cache.outputs.cache-primary-key }}

    # node_modules is restored whole when package-lock.json and patches/ are unchanged, so `npm ci`
    # (and its postinstall patch-package) runs only when they change. It is saved right after the
    # install, before any gate or native build writes into node_modules.
    - name: Restore node_modules
      id: node_modules
      if: ${{ inputs.workspace == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json', 'patches/**') }}

    - name: Install dependencies
      if: ${{ inputs.workspace == 'true' && steps.node_modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci

    - name: Save node_modules
      if: ${{ inputs.workspace == 'true' && inputs.save-caches == 'true' && steps.node_modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.node_modules.outputs.cache-primary-key }}

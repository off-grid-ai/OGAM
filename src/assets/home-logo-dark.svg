<defs>
  <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B1F1D"/>
    <stop offset="52%" stop-color="#0D100F"/>
    <stop offset="100%" stop-color="#060807"/>
  </linearGradient>
  <linearGradient id="rimDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4A544F"/>
    <stop offset="38%" stop-color="#252C28"/>
    <stop offset="100%" stop-color="#030504"/>
  </linearGradient>
  <linearGradient id="sldark" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#83F9A2"/>
    <stop offset="24%" stop-color="#42E886"/>
    <stop offset="58%" stop-color="#16C66F"/>
    <stop offset="100%" stop-color="#006B42"/>
  </linearGradient>
  <filter id="cardDepthDark" x="-12%" y="-12%" width="124%" height="135%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="cardBlurFar"/>
    <feOffset in="cardBlurFar" dx="0" dy="24" result="cardOffsetFar"/>
    <feFlood flood-color="#000000" flood-opacity="0.58" result="cardFarColor"/>
    <feComposite in="cardFarColor" in2="cardOffsetFar" operator="in" result="cardFar"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="cardBlurNear"/>
    <feOffset in="cardBlurNear" dx="0" dy="3" result="cardOffsetNear"/>
    <feFlood flood-color="#000000" flood-opacity="0.5" result="cardNearColor"/>
    <feComposite in="cardNearColor" in2="cardOffsetNear" operator="in" result="cardNear"/>
    <feMerge><feMergeNode in="cardFar"/><feMergeNode in="cardNear"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="markDepthDark" x="-30%" y="-30%" width="170%" height="185%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="64" result="farBlur"/>
    <feOffset in="farBlur" dx="0" dy="96" result="farOffset"/>
    <feFlood flood-color="#00A961" flood-opacity="0.42" result="farColor"/>
    <feComposite in="farColor" in2="farOffset" operator="in" result="farShadow"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="nearBlur"/>
    <feOffset in="nearBlur" dx="0" dy="34" result="nearOffset"/>
    <feFlood flood-color="#000000" flood-opacity="0.72" result="nearColor"/>
    <feComposite in="nearColor" in2="nearOffset" operator="in" result="nearShadow"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="liftBlur"/>
    <feOffset in="liftBlur" dx="-10" dy="-12" result="liftOffset"/>
    <feFlood flood-color="#6EFF9A" flood-opacity="0.14" result="liftColor"/>
    <feComposite in="liftColor" in2="liftOffset" operator="in" result="liftGlow"/>
    <feMerge>
      <feMergeNode in="farShadow"/>
      <feMergeNode in="nearShadow"/>
      <feMergeNode in="liftGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
